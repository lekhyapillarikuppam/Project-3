q: "I am preparing for viva. Tell me what is the purpose of this project and what is happening in it from start to end, based on the actual implementations.",
a: `## 1. Purpose

**Research question:** *How accurately can CLIP and OWLv2, with no training, tell which evidence categories appear in a photo of a staged crime scene? And how trustworthy is the marker-based answer key they are scored against?*

Two questions in one project:
1. **Detector question.** How good are off-the-shelf zero-shot models at finding evidence in crime-scene photos?
2. **Ground-truth question.** The dataset has no per-photo labels, so I built them from the scene's own markers and exhibit lists. How reliable is that answer key?

**Dataset.** FFS (Fictional Forensic Scenes, University of Lausanne, Zenodo, CC BY-NC-SA 4.0). 66 scenes with photos. Each scene has yellow numbered evidence markers and an exhibit list, such as "#7 knife, #8 vodka bottle".

**Scope.** Presence only: "is a blade in this photo?". No counting, no training, and no claim that an object was used in a crime. Stains are called "red-brown stain", never "blood".

## 2. The pipeline, start to end

### Phase 1: feasibility gate
- **Marker finder:** finds yellow placards by colour (HSV) and shape, with dark "ink" inside. No strict triangle test, because tent placards look like different shapes (D-007).
- **OCR:** EasyOCR reads the number, constrained to numbers in that scene's exhibit list. One-digit reads are never "snapped" to a neighbour (D-010).
- **Gate:** hand-labelled 31 photos. Pass marks were finder hit rate >= 0.70 and read accuracy >= 0.60. Result: H 0.87, A 0.65, precision 0.98. This is optimistic, because the same photos were used to tune and to test (D-015).

### Phase 2: data, categories, split, silver labels
- \`fetch_scenes.py\` streams single files out of remote Zenodo zips, so there is no 40+ GB download.
- Exhibit spreadsheets become \`exhibits.csv\` (about 530 exhibits).
- \`category_rules.csv\` is a regex table mapping descriptions to categories. It is multi-label (D-018). Unmatched descriptions got an LLM suggestion that I confirmed by hand.
- **Scene-level dev/test split**, about 40/60, seed 42 (26 dev and 40 test scenes). The seed is never re-drawn (D-017).
- **Silver labels:** marker #7 maps to the exhibit list, which maps to a category, so that category is present in the photo.
- **Final categories chosen mechanically (D-020):** at least 15 test photos from at least 6 scenes. Five passed: ammunition, blade, bottle_glass, paper_document, red_brown_stain.

### Phase 3a: gold labels
Silver is automatic and incomplete, so gold labels were built for the 545 test photos x 5 categories.
- An AI labels all photos (D-026).
- A human then blindly re-decides every AI-vs-silver disagreement and audits 60 random fully-agreed photos (D-027, D-031).
- Provenance is kept per row in \`gold_sources.csv\` (D-028).

### Phase 3b: Stage B detectors
**Detectors never see silver, gold or exhibit lists.**
- **CLIP** (ViT-L/14, baseline): the whole photo padded to a square, scored against 3 prompts per category. Photo score is a softmax across the 5 categories of the mean prompt logit.
- **OWLv2** (base ensemble, main): open-vocabulary detector returning boxes plus scores. Photo score is the best box score. Tiling gave no gain on dev, so the final choice is tile 0 only (D-029).
- Heavy runs were packaged for Kaggle; a local CPU run also exists.
- **Tuning on dev only:** one threshold per category per model, maximising F1 against dev silver, stored in \`protocol/protocol_v1.json\`.

### Phase 3c: freeze, then test evaluation
- The git tag \`protocol-v1\` locks categories, prompts, thresholds and metrics. Scripts refuse to run on test photos without it.
- \`evaluate_test.py\` scores test once, with precision, recall, F1 and AP per category, a scene-level bootstrap (1000 resamples, 95% CIs), a paired OWLv2-minus-CLIP comparison, and error lists.

### Phase 4: demo app
\`build_app.py\` builds a static site in \`docs/\` ("TraceLens") with 30 sample photos.

## 3. Actual results

| System | Precision | Recall | F1 | AP |
|---|---|---|---|---|
| CLIP | 0.45 | 0.37 | **0.29** [0.22-0.35] | 0.42 |
| OWLv2 | 0.67 | 0.53 | **0.56** [0.49-0.61] | 0.69 |

- OWLv2 beats CLIP by +0.275 macro F1 (paired CI 0.19-0.35).
- OWLv2 is best on bottle_glass (F1 0.72) and red_brown_stain (precision 0.89). CLIP's ammunition precision is 0.12. Blade is weak for both.
- **Silver vs gold (macro):** precision 0.89, recall 0.48, F1 0.62, kappa 0.57. Markers are trustworthy when seen, but they miss about half of the true positives.
- Scoring against silver gives lower numbers than against gold (OWLv2 macro F1 0.40 vs 0.56).

## 4. Likely viva questions
- **Why scene-level split and bootstrap?** Photos from one scene are near-duplicates; a photo-level split would leak and photo-level CIs would be too narrow.
- **Why tune on dev only and freeze a tag?** To avoid test leakage and threshold-shopping.
- **Why is silver recall low?** A photo only counts an object if its marker is visible and read correctly.
- **Is the AI-labelled gold circular?** It is a weakness. The mitigation is blind human review of disagreements plus the 60-photo random audit, and provenance is kept per row.
- **Why softmax for CLIP?** There is no "none" prompt, so a photo with no object shows no high share and falls under every threshold.
- **Limitations:** a feasibility sample of only 31 photos, wide blade CIs, staged mannequin scenes, AI-assisted gold labels.

## 5. One thing to be honest about
My search of \`scripts/\` and \`src/\` found no marker-masking experiment code, although SPEC goal G3 lists it. Later I found D-032, which records that it was dropped for time. Also, I could not run Python in that shell (pandas was not installed), so the numbers come from \`results/eval/summary.md\`, \`SPEC.md\`, \`protocol_v1.json\` and CSV row counts.`

q: "What are the categories into which the objects were divided, and on what basis?",
a: `# The categories and how they were chosen

There are two stages: eight candidate categories, then five final ones. They describe *types of evidence* and were taken from the exhibit lists rather than invented.

## Step 1: eight candidate categories

| Category | Typical exhibit wording |
|---|---|
| \`blade\` | knife, cutter, scissors, axe, saw, razor |
| \`firearm\` | pistol, revolver, rifle, shotgun, gun |
| \`ammunition\` | cartridge, casing, bullet |
| \`bottle_glass\` | bottle, vodka, glass |
| \`phone_electronics\` | phone, laptop, computer, tablet |
| \`paper_document\` | A4 sheets, paper, passport, ID card |
| \`footwear\` | shoes, boots, sandals, sneakers |
| \`red_brown_stain\` | reddish trace/mark, stain, red-brown |
| \`other\` | everything that fits none of the above |

## Step 2: how each exhibit got its category
An exhibit's description was mapped by \`data_meta/category_rules.csv\`, a versioned table of case-insensitive regex patterns. This was done by text, not by looking at photos.
- **Multi-label (D-018):** every matching rule adds its category. A "knife with reddish trace" is both blade and red_brown_stain.
- **Exclusive \`other\` rules:** "glass table" and body words go to \`other\` only, so a glass table stays out of bottle_glass and mannequin bodies are never a target.
- **No matching rule:** an LLM suggested a category and I confirmed it by hand. Each row records its source (rule, llm or manual).

Most exhibits went to \`other\` (about 320 of 537 rows, mostly confirmed LLM suggestions), which is why the final set is small.

## Step 3: five final categories, chosen mechanically (D-003, D-020)
The inclusion rule: a category is kept only if the **test** split has at least **15 positive photos from at least 6 scenes**. It was applied once to the silver table with seed 42, and the seed was never re-drawn (D-017).

| Category | Test photos / scenes | Result |
|---|---|---|
| ammunition | 43 / 7 | kept |
| blade | 19 / 6 | kept |
| bottle_glass | 59 / 13 | kept |
| paper_document | 52 / 14 | kept |
| red_brown_stain | 87 / 13 | kept |
| firearm | 20 / 4 | dropped (too few scenes) |
| phone_electronics | 13 / 6 | dropped (too few photos) |
| footwear | 10 / 4 | dropped |

## Why this basis
- The models are not trained, so the categories come from the data, which keeps labels traceable to investigators' own descriptions.
- The statistical rule gives reliable numbers; a category with 10 positive photos would give meaningless CIs.
- It was mechanical and fixed in advance, which blocks choosing categories after seeing model results.
- Presence only (D-005), because FFS has no box annotations.

## Caveats
- The rule used **silver** counts, which are underestimates (silver recall about 0.48). Gold shows more positives, for example blade 51 against 19. Firearm, footwear and phone might have passed under gold, and I did not see a logged revisit of D-020.
- Blade remains the weakest category, so its counts are the least stable.
- \`red_brown_stain\` is a visual category I deliberately did not call "blood", and \`bottle_glass\` is a mixed, coarser class.`

q: "Tell me major interview points I should know.",
a: `# Major interview points

## 1. The 30-second pitch
"I evaluated two zero-shot models, CLIP and OWLv2, on staged crime-scene photos from the FFS dataset. The dataset has no per-photo labels, so I built an answer key from the scenes' own numbered markers and exhibit lists, then measured how trustworthy that key is. OWLv2 reached macro F1 0.56 against CLIP's 0.29. The marker-based key is precise (0.89) but misses about half the true positives (recall 0.48)."

## 2. What is novel or distinctive
- Two questions at once: detector quality and ground-truth quality.
- Ground truth built from the data itself: marker, then exhibit list, then category.
- Honest evaluation design: scene-level split, a frozen protocol (git tag), bootstrap CIs.
- No training; everything is zero-shot.

## 3. Methodology choices you must justify

| Choice | Reason |
|---|---|
| Split by **scene**, not photo (about 40/60, seed 42) | Photos from one scene are near-duplicates, so a photo-level split would leak |
| **Scene-level bootstrap** (1000 resamples) | Photos in a scene are not independent |
| **Tune on dev only, freeze \`protocol-v1\`, score test once** | Prevents test leakage and threshold shopping |
| Categories by a **mechanical rule** | Avoids choosing categories after seeing model results |
| **Presence-level metrics only** | FFS has no box annotations |
| **Paired** OWLv2-minus-CLIP comparison | Same scene resamples, so the difference is tested properly |
| Threshold per category per model | Scores from different categories are not on the same scale |
| CLIP photo score is a **softmax across categories** | There is no "none" prompt |

## 4. Key numbers to memorise
- 66 scenes, 26 dev and 40 test; 545 test photos; 5 categories.
- Marker feasibility gate: hit rate 0.87, read accuracy 0.65, precision 0.98, on only 31 photos (optimistic).
- OWLv2 macro vs gold: precision 0.67, recall 0.53, **F1 0.56** [0.49-0.61], AP 0.69.
- CLIP macro: **F1 0.29** [0.22-0.35], AP 0.42.
- Paired difference: +0.275 F1, CI [0.19, 0.35].
- Silver vs gold: precision 0.89, recall 0.48, F1 0.62, kappa 0.57.

## 5. Findings and what they mean
1. OWLv2 beats CLIP: it localises small objects with a box score, while CLIP scores the whole image.
2. CLIP over-fires: high recall but low precision on ammunition.
3. The silver key is conservative: an object counts only if its marker is visible and read correctly.
4. Scoring against silver understates the models (OWLv2 macro F1 0.40 against silver, 0.56 against gold).
5. Blade and stain are the hardest.

## 6. Limitations (say these before they are asked)
- Gold is AI-labelled and human-checked, not fully human. The human reviewed only AI-vs-silver disagreements (D-031) plus a 60-photo audit. One annotator.
- Feasibility sample is small (31 photos) and tuned on itself.
- Categories were chosen using silver counts, which underestimate.
- Dropped for time (D-032): marker-masking experiment, photo-type slices on test, tiling on test.
- Staged data with mannequins; it will not transfer directly to real casework.
- Wide CIs on blade.

## 7. Questions they will likely ask
- **Why is OWLv2 better?** Open-vocabulary detection with a box score suits small objects in clutter.
- **Is the gold circular?** Partly AI-derived. Blind review, the random audit and provenance tracking are the safeguards; state it as a real limitation.
- **Why not fine-tune?** Out of scope (N4). The question is how far off-the-shelf models go.
- **How do you know there is no test leakage?** Detectors never read silver, gold or exhibit lists; thresholds come from \`protocol_v1.json\` chosen on dev only; the tag is checked in code.
- **What next?** Fully human gold labels, few-shot prompts or fine-tuning, the marker-masking experiment, a "none" prompt for CLIP, larger OWLv2 models.
- **Ethics?** Stains are "red-brown stain", not "blood"; mannequin bodies are not detected as people; outputs are "candidate observations"; the data is CC BY-NC-SA 4.0.

## 8. Engineering points
- Spec-driven development: \`SPEC.md\` is the source of truth, with a decisions log (D-001 to D-033), requirement IDs and acceptance tests mapped to pytest.
- Reproducible: fixed seed, versioned rules, \`run_info\` files with library versions, resumable scripts.
- \`kaggle/stage_b_run.py\` holds the prompts and models; the local run imports it.
- \`schemas.validate\` guards every CSV contract.

## 9. Things I could not verify
- I did not run the code or tests in that session. Numbers come from \`results/eval/summary.md\`, \`SPEC.md\` and \`protocol_v1.json\`.
- \`README.md\` and \`TASKS.md\` have stale or unchecked items.
- I had not investigated why blade is weak; \`results/eval/errors.csv\` has examples to cite.`

// Tiny markdown renderer: headings, lists, tables, code, bold/italic/inline code.
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g,"<em>$1</em>");
  return s;
}
function md(src){
  const lines = src.split("\n"); let out = [], i = 0;
  while(i < lines.length){
    const l = lines[i];
    if(/^```/.test(l)){ let b=[]; i++; while(i<lines.length && !/^```/.test(lines[i])) b.push(lines[i++]); i++;
      out.push("<pre><code>"+esc(b.join("\n"))+"</code></pre>"); continue; }
    const h = l.match(/^(#{1,4}) (.*)/);
    if(h){ out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if(/^\|/.test(l)){ let rows=[]; while(i<lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head = cells(rows[0]), body = rows.slice(2).map(cells);
      out.push("<table><tr>"+head.map(c=>`<th>${inline(c)}</th>`).join("")+"</tr>"+
        body.map(r=>"<tr>"+r.map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>").join("")+"</table>"); continue; }
    if(/^\s*- /.test(l)){ let it=[]; while(i<lines.length && /^\s*- /.test(lines[i])) it.push(lines[i++].replace(/^\s*- /,""));
      out.push("<ul>"+it.map(x=>`<li>${inline(x)}</li>`).join("")+"</ul>"); continue; }
    if(/^\d+\. /.test(l)){ let it=[], start=parseInt(l,10); while(i<lines.length && /^\d+\. /.test(lines[i])) it.push(lines[i++].replace(/^\d+\. /,""));
      out.push(`<ol start="${start}">`+it.map(x=>`<li>${inline(x)}</li>`).join("")+"</ol>"); continue; }
    if(l.trim()===""){ i++; continue; }
    let p=[]; while(i<lines.length && lines[i].trim()!=="" && !/^(#{1,4} |\||\s*- |\d+\. |```)/.test(lines[i])) p.push(lines[i++]);
    out.push("<p>"+inline(p.join(" "))+"</p>");
  }
  return out.join("\n");
}

const root = document.getElementById("turns");
TURNS.forEach((t, n) => {
  const d = document.createElement("div");
  d.className = "turn";
  d.innerHTML = `<div class="q"><span class="tag">Turn ${n+1}</span><p></p></div>
    <details><summary>Response</summary><div class="a">${md(t.a)}</div></details>`;
  d.querySelector(".q p").textContent = t.q;
  root.appendChild(d);
});
const all = open => document.querySelectorAll("details").forEach(x => x.open = open);
document.getElementById("open").onclick = () => all(true);
document.getElementById("close").onclick = () => all(false);
</script>
